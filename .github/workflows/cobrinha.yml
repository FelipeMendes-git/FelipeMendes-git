name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg?palette=github-light&color_snake=#2a3fd0&color_dots=#dde1ee,#aab3e6,#6f7fdc,#2a3fd0,#131a4a
            dist/cobrinha-escura.svg?palette=github-dark&color_snake=#ffd43b&color_dots=#1e2870,#3a4ab0,#6f7fdc,#aab3e6,#ffd43b
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
